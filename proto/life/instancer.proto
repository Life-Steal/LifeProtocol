syntax = "proto3";

package life;

import "life/common.proto";

option java_package = "dev.saltt.life.protocol";
option java_multiple_files = true;

message SetupMatchRequest {
  string match_id = 1;
  GameType game_type = 2;

  repeated MatchPlayer players = 3;

  string map_id = 4;

  int32 minimum_starting_players = 5;

  // Region id the hub chose for this lobby, as named in its config. Informational on the node.
  string region = 6;
}

message SetupMatchResponse {
  bool success = 1;
  string match_id = 2;
  string error = 3;
}

message SpectatorReserveRequest {
  string player_uuid = 1;
  string match_id = 2;
}

message SpectatorReserveResponse {
  bool success = 1;
}

message CancelMatchRequest {
  string match_id = 1;
  string reason = 2;
}

message CancelMatchResponse {
  bool cancelled = 1;
}

message ForfeitPlayerRequest {
  string match_id = 1;
  string player_uuid = 2;
}

message ForfeitPlayerResponse {
  bool forfeited = 1;
}

service InstancerService {
  rpc SetupMatch(SetupMatchRequest) returns (SetupMatchResponse);
  rpc SpectatorReserve(SpectatorReserveRequest) returns (SpectatorReserveResponse);
  rpc CancelMatch(CancelMatchRequest) returns (CancelMatchResponse);
  rpc ForfeitPlayer(ForfeitPlayerRequest) returns (ForfeitPlayerResponse);
}
